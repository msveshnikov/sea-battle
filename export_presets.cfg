<meta name=\"description\" content=\"Steel Tide - 3D Sea Battle: fleets, shells, fire, AI admirals and online duels.\">
<script async src=\"https://www.googletagmanager.com/gtag/js?id=G-LG2054333Z\"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LG2054333Z',{game:'seabattle'});</script>
<style>
html, body { background:#05121e; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
#canvas { touch-action:none; }
</style>
<script>
// Phones: first tap -> fullscreen + landscape lock (Android Chrome needs fullscreen for the lock).
(function () {
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!coarse) return;
  function goFull() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
    try {
      var p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('touchend', goFull, { passive: true });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>"
